<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      /* Broadsheet Newspaper Dynamic Light / Dark Theming */
      .bg-paper { fill: #f5f0ea; }
      .sheet-surface { fill: #fffdf9; stroke: #2c2523; stroke-width: 7; }
      .ruling-line { stroke: #2c2523; stroke-width: 2.5; fill: none; }
      .ruling-dash { stroke: #2c2523; stroke-width: 1.5; stroke-dasharray: 8 5; fill: none; opacity: 0.65; }
      .letter-f { fill: #1c1917; }
      .accent-red { fill: #8a1c14; }
      .accent-stroke { stroke: #8a1c14; }

      @media (prefers-color-scheme: dark) {
        .bg-paper { fill: #0c0b09; }
        .sheet-surface { fill: #24201c; stroke: #524538; stroke-width: 7; }
        .ruling-line { stroke: #524538; }
        .ruling-dash { stroke: #524538; opacity: 0.5; }
        .letter-f { fill: #fbf6ee; }
        .accent-red { fill: #e26450; }
        .accent-stroke { stroke: #e26450; }
      }
    </style>
  </defs>

  <!-- Base Broadsheet Paper Plate with Rounded Corners -->
  <rect class="bg-paper" x="12" y="12" width="488" height="488" rx="64" />
  
  <!-- Outer Newsprint Sheet Surface -->
  <rect class="sheet-surface" x="24" y="24" width="464" height="464" rx="52" />
  
  <!-- Classic Front-Page Double-Rule Frame -->
  <rect class="ruling-line" x="42" y="42" width="428" height="428" rx="38" />
  <rect class="ruling-dash" x="52" y="52" width="408" height="408" rx="30" />
  <rect class="ruling-line" x="62" y="62" width="388" height="388" rx="22" />

  <!-- Corner Broadsheet Diamonds (❖) -->
  <g class="accent-red">
    <path d="M 82 72 L 92 82 L 82 92 L 72 82 Z" />
    <path d="M 430 72 L 440 82 L 430 92 L 420 82 Z" />
    <path d="M 82 420 L 92 430 L 82 440 L 72 430 Z" />
    <path d="M 430 420 L 440 430 L 430 440 L 420 430 Z" />
  </g>

  <!-- AUTHENTIC BROADSHEET CAPITAL 'F' -->
  <!-- Classical Didone / Caslon high-contrast letterform: heavy vertical stem, bracketed serifs, downward top beak, bifurcated crossbar -->
  <path class="letter-f" fill-rule="evenodd" d="
    M 128 396
    L 284 396
    L 284 378
    C 270 376, 258 368, 250 354
    C 242 340, 238 322, 238 300
    L 238 274
    L 316 274
    C 334 274, 342 284, 345 298
    L 354 298
    L 354 220
    L 345 220
    C 342 234, 334 244, 316 244
    L 238 244
    L 238 174
    C 238 152, 246 142, 268 140
    C 282 138, 316 138, 338 138
    C 366 138, 380 148, 384 174
    L 394 174
    L 390 116
    L 144 116
    L 144 126
    C 166 128, 176 138, 176 160
    L 176 340
    C 176 362, 166 374, 144 376
    L 128 378
    Z
  " />

  <!-- Editorial Wax Seal Stamp Accent (Bottom Right of F) -->
  <circle class="accent-red" cx="362" cy="362" r="20" />
  <circle class="sheet-surface" cx="362" cy="362" r="12" stroke-width="2.5" />
  <circle class="accent-red" cx="362" cy="362" r="5" />
</svg>